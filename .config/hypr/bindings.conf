# AI Button binding - AI button sends Alt+Shift+F23
# (Note: META becomes ALT due to altwin:swap_alt_win in input.conf)
bindd = ALT SHIFT, F23, AI Button, exec, omarchy-menu

# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Lazy Git, exec, omarchy-launch-tui lazygit -p $(grep -A 1 "recentrepos:" ~/.local/state/lazygit/state.yml | tail -1 | sed 's/^[[:space:]]*-[[:space:]]*//')
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Switch keybord layout, exec, ~/.local/bin/notify-layout.sh
bindd = ALT, SPACE, Launch apps, exec, omarchy-launch-walker

unbind = SUPER ALT, SPACE
bindd = SUPER, grave, Omarchy menu, exec, omarchy-menu

unbind = SUPER, W
bindd = SUPER, Q, Close window, killactive,

bindd = SUPER, E, Toggle scratchpad, togglespecialworkspace, scratchpad
unbind = SUPER ALT, S
bindd = SUPER ALT, E, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

# Notes scratchpad
bindd = SUPER, N, Toggle notes, togglespecialworkspace, notes
bindd = SUPER ALT, N, Move window to notes, movetoworkspacesilent, special:notes

# Remap some keys from CMD to CTRL
unbind = SUPER, S
bindd = SUPER, S, Universal save, sendshortcut, CTRL, code:39,
bindd = SUPER, Z, Universal undo, sendshortcut, CTRL, code:52,
bindd = SUPER, A, Universal select all, sendshortcut, CTRL, code:38,
unbind = SUPER, F
bindd = SUPER, F, Universal search, sendshortcut, CTRL, code:41,

unbind = SUPER, BACKSPACE

unbind = SUPER, Slash
bindd = SUPER, Slash, Universal comment, sendshortcut, CTRL, code:53,

# I don't want to toggle waybar
unbind = SUPER SHIFT, SPACE

# Fullscreen rebindings
bindd = , F11, Full screen, fullscreen, 0
bindd = ALT, F11, Full width, fullscreen, 1
bindd = CTRL, F11, Tiled full screen, fullscreenstate, 0 2
unbind = SUPER CTRL, F
unbind = SUPER ALT, F
